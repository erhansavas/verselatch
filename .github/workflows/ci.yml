name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'
      - name: Install portable QA tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream cmake desktop-file-utils ninja-build shellcheck
          python -m pip install --disable-pip-version-check \
            'setuptools>=77.0.3' 'pytest>=8.4' 'ruff>=0.12' \
            'bandit>=1.9' 'reuse==6.2.0' 'tomli>=2.0.1,<3; python_version < "3.11"' \
            'defusedxml>=0.7.1' 'build>=1.2'
      - name: Stage clean release tree
        run: |
          rm -rf "$RUNNER_TEMP/verselatch-release-tree"
          mkdir -p "$RUNNER_TEMP/verselatch-release-tree"
          git archive --format=tar HEAD | tar -xf - -C "$RUNNER_TEMP/verselatch-release-tree"
      - name: Portable build and regression gate
        run: |
          cd "$RUNNER_TEMP/verselatch-release-tree"
          ./tools/quality_gate.sh --portable --public-metadata
      - name: Native worker candidate build
        run: |
          cd "$RUNNER_TEMP/verselatch-release-tree"
          cmake -S native/worker -B "$RUNNER_TEMP/verselatch-worker-build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/verselatch-worker-build" \
            --target verselatch-worker --parallel 2
          worker="$RUNNER_TEMP/verselatch-worker-build/verselatch-worker"
          test -x "$worker"
          set +e
          response="$(printf '%s' '{"audio_ref":"/tmp/a","language":"auto","lyrics":null,"model_ref":"/tmp/m","protocol":1,"request_id":41,"surprise":true,"type":"analyze"}' | "$worker")"
          status=$?
          set -e
          test "$status" -eq 2
          WORKER_RESPONSE="$response" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ["WORKER_RESPONSE"])
          assert data == {
              "code": "INVALID_REQUEST",
              "message": "worker request fields are invalid or duplicated",
              "protocol": 1,
              "request_id": 41,
              "type": "error",
          }, data
          print("Native worker protocol smoke: PASS")
          PY
          bundle="$RUNNER_TEMP/verselatch-worker-bundle"
          test ! -e "$bundle"
          python3 tools/stage_linux_worker_bundle.py stage \
            --worker "$worker" \
            --output "$bundle" \
            --arch "$(uname -m)" \
            --source-commit "$GITHUB_SHA"
          python3 tools/stage_linux_worker_bundle.py verify \
            --bundle "$bundle" \
            --source-commit "$GITHUB_SHA"
          app_payload="$RUNNER_TEMP/verselatch-app-payload"
          test ! -e "$app_payload"
          python3 tools/stage_linux_app_payload.py stage \
            --worker-bundle "$bundle" \
            --output "$app_payload" \
            --source-commit "$GITHUB_SHA"
          python3 tools/stage_linux_app_payload.py verify \
            --bundle "$app_payload" \
            --source-commit "$GITHUB_SHA"
      - name: Portable external static gates
        run: |
          cd "$RUNNER_TEMP/verselatch-release-tree"
          desktop-file-validate data/io.github.erhansavas.verselatch.desktop
          AS_VALIDATE_NONET=1 ./tools/validate_appstream.sh --public
          shellcheck packaging/linux/*.sh tools/*.sh
          reuse lint
          ruff check --no-cache src tests tools
          bandit -q -r src tools -x tests -ll
